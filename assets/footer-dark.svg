<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="102" viewBox="0 0 1200 102" role="img" aria-labelledby="title desc">
  <title id="title">Always under construction.</title>
  <desc id="desc">Посмотреть все публичные репозитории HVHBIGNAME.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#30392c" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#d2ff5a" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#d2ff5a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
    .float { animation: float 8s ease-in-out infinite; }
    .flow { stroke-dasharray: 5 18; animation: flow 24s linear infinite; }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    .hero-mobile { display: none; }
    @media (max-width: 600px) { .hero-desktop { display: none; } .hero-mobile { display: inline; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes flow { to { stroke-dashoffset: -276; } }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .float, .flow, .pulse { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="101" rx="18" fill="#101310" stroke="#30392c"/>

    <path d="M36 50h18M45 41v18" stroke="#d2ff5a" stroke-width="1"/>
    <text x="75" y="46" font-size="25" fill="#f0f2e8" font-weight="700" letter-spacing="-0.6">ALWAYS UNDER CONSTRUCTION.</text>
    <text x="76" y="71" font-size="11" fill="#a1ad9b" class="mono" letter-spacing="1">HVHBIGNAME / SEE YOU IN THE COMMIT LOG.</text>
    <text x="1110" y="55" font-size="12" fill="#a1ad9b" class="mono" text-anchor="end">EXPLORE THE SOURCE</text>
    <path d="M1133 60 1149 44m-14 0h14v14" fill="none" stroke="#d2ff5a" stroke-width="2"/>

</svg>
