name: Обновление профиля

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - README.md
      - scripts/**
      - .github/workflows/update-profile.yml

concurrency:
  group: profile-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Проверка генератора
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Обновление сигнала и журнала проектов
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile.py

      - name: Коммит изменений
        run: |
          git add README.md assets/activity-graph.svg assets/activity-graph-light.svg
          if git diff --cached --quiet; then
            echo "Изменений нет — пропускаю коммит."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Автообновление проектов и графика активности"
            git push
          fi
